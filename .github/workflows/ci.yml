name: Python CI


on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install test tools
        run: pip install pytest ruff

      - name: Lint Python
        run: ruff check tests/compliance_rules.py tests/test_baseline.py

      - name: Run tests
        run: |
          python -m pytest -q tests/test_baseline.py